name: Shadowing

options:
  bundleIdPrefix: com.hedon
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

targets:
  Shadowing:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Domain
      - path: Features
        optional: true
      - path: Audio
        optional: true
      - path: Persistence
      - path: Services
        optional: true
      - path: Resources
        optional: true
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: Shadowing
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Shadowing.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: true
      # Debug (and the test host) is a separate app for macOS: its own microphone grant,
      # preferences and data folder (Application Support/Shadowing-Debug), so it never mixes
      # with the installed Release app.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.hedon.shadowing.debug
          SHADOWING_DATA_FOLDER_NAME: Shadowing-Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.hedon.shadowing
          SHADOWING_DATA_FOLDER_NAME: Shadowing
    scheme:
      testTargets:
        - ShadowingTests

  ShadowingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Shadowing
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedon.shadowing.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
