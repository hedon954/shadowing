name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Release DMG
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Shadowing/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $version) does not match CFBundleShortVersionString $plist_version in Shadowing/Info.plist"
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          xcode_app="$(printf '%s\n' /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -n 1)"
          if [[ ! -d "$xcode_app" ]]; then
            echo "No Xcode 26 found on this runner" >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode_app/Contents/Developer"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install development tools
        run: brew bundle --file Brewfile

      - name: Build DMG
        run: VERSION=${GITHUB_REF_NAME#v} make dmg

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog_path = "CHANGELOG.md"
          text = open(changelog_path, encoding="utf-8").read()

          heading = re.compile(rf"^## \[{re.escape(version)}\].*$", re.MULTILINE)
          match = heading.search(text)
          if not match:
              print(f"CHANGELOG.md does not contain a section for {version}", file=sys.stderr)
              sys.exit(1)

          rest = text[match.start():]
          next_section = re.search(r"\n---\s*\n## \[", rest)
          section = rest[: next_section.start()].strip() if next_section else rest.strip()
          if not section:
              print(f"CHANGELOG.md section for {version} is empty", file=sys.stderr)
              sys.exit(1)

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as output:
              output.write(section + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Shadowing ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/Shadowing-*.dmg
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
