included:
  - Shadowing

excluded:
  - Shadowing/Shadowing.xcodeproj

strict: true

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 700

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
  excluded:
    - db
    - id

# `let _ = RenderProbe.note(...)` in SwiftUI bodies (debug-only redraw counters for tests).
redundant_discardable_let:
  ignore_swiftui_view_bodies: true
